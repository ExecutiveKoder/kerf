[project]
name = "kerf"
version = "0.1.0"
description = "Kerf — personal-use web security proxy. No commercial use, no redistribution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Kerf Personal Use License" }
authors = [{ name = "Smashrock Media Inc" }]
dependencies = [
    "cryptography>=42.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "httpx>=0.27",
    "playwright>=1.49",
    "python-socks>=2.4",
    "h2>=4.1",
    "pyyaml>=6.0",
    "stripe>=11.0",
]

[project.scripts]
kerf = "main:main"
dastday = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
